services:
  backend:
    build:
      context: ./backend
      target: development
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 5050
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
    ports:
      - "5050:5050"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
